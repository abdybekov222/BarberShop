services:
  - type: web
    name: bars-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @barbershop/shared build && pnpm --filter @barbershop/api exec prisma generate --schema=prisma/schema.prisma && pnpm --filter @barbershop/api build
    startCommand: pnpm --filter @barbershop/api exec prisma migrate deploy && pnpm --filter @barbershop/api start
    healthCheckPath: /api/health
    disk:
      name: bars-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        fromService:
          name: bars-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: STORAGE_DIR
        value: /opt/render/project/src/storage
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STORAGE_SIGNING_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: SALON_TZ
        value: Asia/Bishkek
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-image
      - key: GEMINI_COST_USD
        value: "0.07"
      - key: AI_MODEL_VERSION
        value: gemini-3.1-flash-image

  - type: web
    name: bars-web
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @barbershop/shared build && pnpm --filter @barbershop/web build
    startCommand: pnpm --filter @barbershop/web start -- --hostname 0.0.0.0
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: bars-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          name: bars-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
